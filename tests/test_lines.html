<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pinta Line Tests</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="mocha.css" />
    <link rel="stylesheet" href="../style.css" />
    <script src="../lib/interact.min.js"></script>
    <link href="../lib/metap/metap.css" rel="stylesheet" />
    <script src="../lib/metap/metap.js"></script>
  </head>
  <body>
    <div id="mocha"></div>
    <div
      id="editor-container"
      style="
        width: 800px;
        height: 600px;
        border: 1px solid black;
        position: absolute;
        opacity: 0;
        z-index: -1;
      "
    ></div>
    <!--- Comment the opacity and z-index to see the interactive test running  -->
    <input
      type="file"
      id="filePicker"
      accept=".pnt,.html,.htm"
      style="display: none"
    />
    <div class="modal-overlay" id="deleteConfirmationModal">
      <div class="modal-content">
        <h3>Confirm Deletion</h3>
        <p id="deleteModalMessage">
          Are you sure you want to delete this item? This action cannot be
          undone.
        </p>
        <div class="modal-buttons">
          <button class="modal-cancel-button" id="cancelDeleteButton">
            Cancel
          </button>
          <button class="modal-confirm-button" id="confirmDeleteButton">
            Delete
          </button>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="linkModal">
      <div class="modal-content">
        <h3>Edit Link</h3>
        <input
          type="text"
          id="linkUrlInput"
          placeholder="Enter URL (e.g., https://example.com)"
          style="width: 90%; margin-bottom: 15px; padding: 8px"
        />
        <div class="modal-buttons">
          <button
            class="modal-cancel-button"
            id="removeLinkButton"
            style="background-color: var(--base01)"
          >
            Remove Link
          </button>
          <button class="modal-cancel-button" id="cancelLinkModalButton">
            Cancel
          </button>
          <button
            class="modal-confirm-button"
            id="saveLinkButton"
            style="background-color: var(--blue)"
          >
            Save Link
          </button>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="helpModal" style="display: none">
      <button class="modal-close-button" id="closeHelpModalButton">
        &times;
      </button>
      <div class="modal-content" id="helpModalContent"></div>
    </div>
    <script src="chai.js"></script>
    <script src="mocha.js"></script>
    <script type="module">
      mocha.setup("bdd");
    </script>
    <script type="module" src="test_lines.js"></script>
  </body>
</html>
