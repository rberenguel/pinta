<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="icon.png" />
    <title>Pinta</title>
    <link href="style.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  </head>
  <body>
    <div id="editor-container">
      <svg id="drawingCanvas" width="100%" height="100%">
        <defs>
          <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
            <feOffset dx="1" dy="1" result="offsetBlur" />
            <feMerge>
              <feMergeNode in="offsetBlur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <marker
            id="arrowhead-red"
            markerWidth="10"
            markerHeight="7"
            refX="8"
            refY="3.5"
            orient="auto"
          >
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--red)" />
          </marker>
          <marker
            id="arrowhead-orange"
            markerWidth="10"
            markerHeight="7"
            refX="8"
            refY="3.5"
            orient="auto"
          >
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--orange)" />
          </marker>
          <marker
            id="arrowhead-yellow"
            markerWidth="10"
            markerHeight="7"
            refX="8"
            refY="3.5"
            orient="auto"
          >
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--yellow)" />
          </marker>
          <marker
            id="arrowhead-green"
            markerWidth="10"
            markerHeight="7"
            refX="8"
            refY="3.5"
            orient="auto"
          >
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--green)" />
          </marker>
          <marker
            id="arrowhead-blue"
            markerWidth="10"
            markerHeight="7"
            refX="8"
            refY="3.5"
            orient="auto"
          >
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--blue)" />
          </marker>
          <marker
            id="arrowhead-cyan"
            markerWidth="10"
            markerHeight="7"
            refX="8"
            refY="3.5"
            orient="auto"
          >
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--cyan)" />
          </marker>
          <marker
            id="arrowhead-violet"
            markerWidth="10"
            markerHeight="7"
            refX="8"
            refY="3.5"
            orient="auto"
          >
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--violet)" />
          </marker>
          <marker
            id="arrowhead-magenta"
            markerWidth="10"
            markerHeight="7"
            refX="8"
            refY="3.5"
            orient="auto"
          >
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--magenta)" />
          </marker>
          <marker
            id="arrowhead-print"
            markerWidth="10"
            markerHeight="7"
            refX="8"
            refY="3.5"
            orient="auto"
          >
            <polygon points="0 0, 10 3.5, 0 7" fill="black" />
          </marker>
        </defs>
      </svg>
    </div>
    <input type="file" id="filePicker" accept=".json" style="display: none" />

    <div class="modal-overlay" id="deleteConfirmationModal">
      <div class="modal-content">
        <h3>Confirm Deletion</h3>
        <p id="deleteModalMessage">
          Are you sure you want to delete this item? This action cannot be
          undone.
        </p>
        <div class="modal-buttons">
          <button class="modal-cancel-button" id="cancelDeleteButton">
            Cancel
          </button>
          <button class="modal-confirm-button" id="confirmDeleteButton">
            Delete
          </button>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="linkModal">
      <div class="modal-content">
        <h3>Edit Link</h3>
        <input
          type="text"
          id="linkUrlInput"
          placeholder="Enter URL (e.g., https://example.com)"
          style="width: 90%; margin-bottom: 15px; padding: 8px"
        />
        <div class="modal-buttons">
          <button
            class="modal-cancel-button"
            id="removeLinkButton"
            style="background-color: var(--base01)"
          >
            Remove Link
          </button>
          <button class="modal-cancel-button" id="cancelLinkModalButton">
            Cancel
          </button>
          <button
            class="modal-confirm-button"
            id="saveLinkButton"
            style="background-color: var(--blue)"
          >
            Save Link
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="pinta.js"></script>
  </body>
</html>
